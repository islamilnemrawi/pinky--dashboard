name: Inspect Elory Dashboard source layout

on:
  push:
    branches:
      - feature/elory-owner-data-reset-website-tabs-2026-11-17
    paths:
      - '.github/workflows/inspect-elory-source.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive and report UI integration points
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/elory-source"
          unzip -q Elory_Dashboard_Build_Ready.zip -d "$RUNNER_TEMP/elory-source"
          PROJECT_DIR="$(dirname "$(find "$RUNNER_TEMP/elory-source" -type f -name settings.gradle.kts -print -quit)")"
          export PROJECT_DIR
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          root = Path(os.environ["PROJECT_DIR"])
          src = root / "app/src/main/java"
          terms = ("order", "customer", "coupon", "website", "pinkapp")
          print("=== SCREEN FILE CANDIDATES ===")
          for p in sorted((src / "ui/screens").rglob("*.kt")):
              print(p.relative_to(src))
          def show(path, start, end):
              p = src / path
              if not p.exists():
                  print(f"--- MISSING {path} ---"); return
              lines = p.read_text(encoding="utf-8").splitlines()
              print(f"--- {path} lines {start}-{min(end,len(lines))} of {len(lines)} ---")
              for n in range(start-1, min(end,len(lines))):
                  print(f"{n+1}: {lines[n]}")
          show(Path("com/pinky/dashboard/ui/screens/customers/CustomersScreen.kt"), 1, 115)
          show(Path("com/pinky/dashboard/ui/screens/orders/OrdersScreen.kt"), 1, 175)
          show(Path("com/pinky/dashboard/ui/PinkyApp.kt"), 195, 335)
          show(Path("com/pinky/dashboard/ui/screens/website/WebsiteEditorScreen.kt"), 1, 350)
          show(Path("com/pinky/dashboard/ui/screens/website/WebsiteEditorScreen.kt"), 1400, 1490)
          show(Path("com/pinky/dashboard/ui/screens/offers/OffersScreen.kt"), 1, 260)
          show(Path("com/pinky/dashboard/ui/screens/offers/OffersScreen.kt"), 260, 460)
          show(Path("com/pinky/dashboard/ui/PinkyApp.kt"), 35, 105)
          show(Path("com/pinky/dashboard/ui/PinkyViewModel.kt"), 180, 250)
          show(Path("com/pinky/dashboard/ui/PinkyViewModel.kt"), 390, 455)
          show(Path("com/pinky/dashboard/ui/PinkyViewModel.kt"), 680, 745)
          print("=== REPOSITORY FILE CANDIDATES ===")
          for p in sorted((root / "app/src/main/java/com/pinky/dashboard").rglob("*.kt")):
              if "Repository" in p.name or "Dao" in p.name:
                  print(p.relative_to(root / "app/src/main/java"))
          print("=== REPOSITORY SYNC METHODS ===")
          repo_file = root / "app/src/main/java/com/pinky/dashboard/data/repository/RepositoriesImpl.kt"
          repo_lines=repo_file.read_text(encoding="utf-8").splitlines()
          for i,line in enumerate(repo_lines):
              if re.search(r"syncOrders|syncCustomers|getOrdersFlow|getCustomersFlow|delete.*Order|delete.*Customer|clearAll|deleteAll",line,re.I):
                  print(f"{i+1}: {line[:300]}")
                  for n in range(max(0,i-2),min(len(repo_lines),i+16)):
                      print(f"{n+1}: {repo_lines[n]}")
          print("=== DAO DEFINITIONS ===")
          dao=root / "app/src/main/java/com/pinky/dashboard/data/local/dao/Daos.kt"
          dao_lines=dao.read_text(encoding="utf-8").splitlines()
          for i,line in enumerate(dao_lines):
              if re.search(r"interface .*Dao|deleteAll|deleteBy|delete.*Order|delete.*Customer|clear",line,re.I):
                  print(f"{i+1}: {line[:300]}")
          print("=== REPOSITORY ORDER/CUSTOMER SYNC CONTEXT ===")
          for pattern in ("syncOrders", "syncCustomers", "class CustomerRepositoryImpl"):
              for i,line in enumerate(repo_lines):
                  if pattern in line:
                      print(f"--- {pattern} at {i+1} ---")
                      for n in range(max(0,i-4),min(len(repo_lines),i+70)):
                          print(f"{n+1}: {repo_lines[n]}")
          print("=== CUSTOMER SYNC DEFINITIONS ===")
          for p in sorted((root / "app/src/main/java").rglob("*.kt")):
              lines=p.read_text(encoding="utf-8").splitlines()
              for i,line in enumerate(lines):
                  if "syncCustomers" in line or "class CustomerRepository" in line:
                      print(f"--- {p.relative_to(root / 'app/src/main/java')} ---")
                      for n in range(max(0,i-3),min(len(lines),i+45)): print(f"{n+1}: {lines[n]}")
          print("=== ORDER AND CUSTOMER DAO DEFINITIONS ===")
          dao_lines=dao.read_text(encoding="utf-8").splitlines()
          for i in range(min(len(dao_lines),140)): print(f"{i+1}: {dao_lines[i]}")
          print("=== ENTITY TABLE NAMES ===")
          for p in sorted((root / "app/src/main/java").rglob("*.kt")):
              lines=p.read_text(encoding="utf-8").splitlines()
              if any("data class OrderEntity" in x or "data class CustomerEntity" in x for x in lines):
                  print(f"--- {p.relative_to(root / 'app/src/main/java')} ---")
                  for i,line in enumerate(lines):
                      if "@Entity" in line or "data class OrderEntity" in line or "data class CustomerEntity" in line:
                          for n in range(max(0,i-2),min(len(lines),i+8)): print(f"{n+1}: {lines[n]}")
          print("=== VIEWMODEL DATA METHODS ===")
          vm = src / "com/pinky/dashboard/ui/PinkyViewModel.kt"
          vm_lines=vm.read_text(encoding="utf-8").splitlines()
          for i,line in enumerate(vm_lines):
              if re.search(r"orderRepository|customerRepository|couponRepository|syncOrders|syncCustomers|syncCoupons|syncRemainingSupabaseData|deleteOrder|deleteCustomer|deleteCoupon|_orders|_customers|_coupons|currentUser",line,re.I):
                  print(f"{i+1}: {line[:300]}")
          print("=== SUPABASE API METHODS ===")
          api = src / "com/pinky/dashboard/data/remote/SupabaseClient.kt"
          api_lines=api.read_text(encoding="utf-8").splitlines()
          for i,line in enumerate(api_lines):
              if re.search(r"orders|customers|coupons|coupon_redemptions|@POST|@DELETE",line,re.I):
                  if i < 700: print(f"{i+1}: {line[:300]}")
          print("=== WEBSITE EDITOR CARDS ===")
          show(Path("com/pinky/dashboard/ui/screens/website/WebsiteEditorScreen.kt"), 160, 350)
          print("=== OFFERS COUPON LIST ===")
          show(Path("com/pinky/dashboard/ui/screens/offers/OffersScreen.kt"), 205, 325)
          print("=== COUPON / OFFER COMPOSABLES ===")
          for p in sorted(src.rglob("*.kt")):
              lines=p.read_text(encoding="utf-8").splitlines()
              hits=[i for i,line in enumerate(lines) if re.search(r"coupon|كوبون|promo|offer|عرض",line,re.I)]
              if hits and ("ui/screens" in str(p) or "PinkyApp.kt" in p.name):
                  print(f"--- {p.relative_to(src)} ({len(lines)} lines) ---")
                  for i in hits[:35]:
                      print(f"{i+1}: {lines[i][:300]}")
          PY