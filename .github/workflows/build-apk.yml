
name: Build Elory Dashboard APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract dashboard ZIP
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip'
          )

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one ZIP file in repository root."
            echo "Found: ${#ZIP_FILES[@]}"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/_dashboard_source"
          unzip -q "${ZIP_FILES[0]}" -d "$GITHUB_WORKSPACE/_dashboard_source"

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/_dashboard_source" \
            -type f -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project at: $PROJECT_DIR"

      - name: Prepare build configuration
        working-directory: ${{ steps.locate.outputs.project_dir }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          cp .env.example .env

          if [ -n "${GEMINI_API_KEY:-}" ]; then
            awk '!/^GEMINI_API_KEY=/' .env.example > .env
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> .env
          fi

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elory-Dashboard-APK
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
