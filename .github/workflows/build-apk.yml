name: Build Pinky Dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Pinky Dashboard APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Pinky ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 4 -type f -iname '*.zip' \
            ! -path './.git/*' \
            -printf '%s %p\n' \
            | sort -nr \
            | head -n 1 \
            | cut -d' ' -f2-)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Pinky ZIP file found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Pinky project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/_pinky_project"
          mkdir -p "$GITHUB_WORKSPACE/_pinky_project"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/_pinky_project"

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(find "$GITHUB_WORKSPACE/_pinky_project" \
            -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
            -printf '%h\n' \
            | head -n 1)"

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Android project root not found."
            exit 1
          fi

          if [ ! -d "$PROJECT_ROOT/app" ]; then
            echo "ERROR: app module not found."
            exit 1
          fi

          echo "Project root:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify Gradle project
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Project ====="
          pwd

          echo "===== Files ====="
          ls -la

          echo "===== App ====="
          ls -la app

          echo "===== Gradle ====="
          gradle --version

      - name: Create debug keystore
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare environment
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "ERROR: SUPABASE_URL secret is missing."
            exit 1
          fi

          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "ERROR: SUPABASE_ANON_KEY secret is missing."
            exit 1
          fi

          cat > .env <<EOF
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          GEMINI_API_KEY=${GEMINI_API_KEY:-}
          OWNER_PASSWORD=${OWNER_PASSWORD:-}
          EOF

          echo "Environment prepared."

      - name: Check Google Services
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          if [ -f "app/google-services.json" ]; then
            echo "google-services.json found."
          else
            echo "google-services.json not found."
            echo "Continuing because Google Services is configured to warn."
          fi

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Find APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug \
            -type f \
            -name '*.apk' \
            -print \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/Pinky-Dashboard.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pinky-Dashboard-APK
          path: Pinky-Dashboard.apk
          if-no-files-found: error
          retention-days: 14
