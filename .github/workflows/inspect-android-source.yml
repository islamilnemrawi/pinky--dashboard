name: Inspect Elory Android source archive

on:
  push:
    branches:
      - elory/feature-order-metrics-push-icon
    paths:
      - .github/workflows/inspect-android-source.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract canonical source archive
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/elory-source"
          unzip -q Elory_Dashboard_Build_Ready.zip -d "$RUNNER_TEMP/elory-source"
          PROJECT_SETTINGS="$(find "$RUNNER_TEMP/elory-source" -type f -name settings.gradle.kts -print -quit)"
          test -n "$PROJECT_SETTINGS"
          PROJECT_DIR="$(dirname "$PROJECT_SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Extracted Android project structure:"
          find "$PROJECT_DIR" -type f | sed "s#^$PROJECT_DIR/##" | sort
      - name: Upload extracted source for controlled review
        uses: actions/upload-artifact@v4
        with:
          name: elory-dashboard-source-review
          path: ${{ runner.temp }}/elory-source
          if-no-files-found: error
          retention-days: 1
