name: Build Pinky APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Pinky ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf android_project
          mkdir android_project

          unzip -q "$ZIP_FILE" -d android_project

          echo "Extracted files:"
          find android_project -maxdepth 3 -type f | head -100

      - name: Detect Android project root
        shell: bash
        run: |
          set -e

          ROOT=$(find android_project -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) -print -quit | xargs -r dirname)

          if [ -z "$ROOT" ]; then
            echo "ERROR: Android Studio project root was not found."
            exit 1
          fi

          echo "Android project root: $ROOT"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "ERROR: gradlew was not found."
            exit 1
          fi

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          ./gradlew clean assembleDebug --stacktrace

      - name: Find APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated: $APK"
          cp "$APK" "$GITHUB_WORKSPACE/Pinky-Dashboard-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pinky-Dashboard-APK
          path: Pinky-Dashboard-debug.apk
          if-no-files-found: error
