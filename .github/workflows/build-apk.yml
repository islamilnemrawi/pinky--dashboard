
name: Build Elory Dashboard APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elory-dashboard-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare project
        working-directory: dash
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -Eeuo pipefail

          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f .env.example

          cp .env.example .env

          if [ -n "${GEMINI_API_KEY:-}" ]; then
            python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(".env")
          lines = path.read_text().splitlines()
          key = os.environ["GEMINI_API_KEY"]
          lines = [
              line for line in lines
              if not line.startswith("GEMINI_API_KEY=")
          ]
          lines.append("GEMINI_API_KEY=" + key)
          path.write_text("\n".join(lines) + "\n")
          PY
          fi

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Apply known Kotlin compile fix
        working-directory: dash
        shell: bash
        run: |
          set -Eeuo pipefail

          FILE="app/src/main/java/com/pinky/dashboard/ui/screens/health/HealthCheckScreen.kt"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text()

          old = "SupabaseClient.service.getProducts()"
          new = """SupabaseClient.service.getProducts(
                      select = "*",
                      order = "id.asc",
                      range = "0-999",
                      rangeUnit = "items"
                  )"""

          if old in source:
              source = source.replace(old, new, 1)
              path.write_text(source)
              print("Applied known getProducts() compile fix.")
          elif new in source:
              print("Compile fix already exists; no change needed.")
          else:
              raise SystemExit(
                  "Expected getProducts() call was not found. "
                  "Please inspect HealthCheckScreen.kt."
              )
          PY

      - name: Verify Gradle
        run: gradle --version

      - name: Build Debug APK
        working-directory: dash
        run: |
          gradle --no-daemon \
            --stacktrace \
            --max-workers=2 \
            :app:assembleDebug

      - name: Verify APK exists
        working-directory: dash
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elory-Dashboard-APK
          path: dash/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
