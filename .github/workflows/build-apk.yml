name: Build Pinky Dashboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Pinky Dashboard APK
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: "17"
      GRADLE_VERSION: "9.3.1"

    steps:

      # =========================================================
      # 1) Checkout repository
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2) Find Pinky ZIP
      # =========================================================
      - name: Find Pinky ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository files:"
          find . -maxdepth 2 -type f -print | sort

          ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Pinky Dashboard ZIP file was not found."
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "PINKY_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"


      # =========================================================
      # 3) Extract Pinky Dashboard
      # =========================================================
      - name: Extract Pinky Dashboard
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/pinky_project"

          mkdir -p "$GITHUB_WORKSPACE/pinky_project"

          echo "Extracting:"
          echo "$PINKY_ZIP"

          unzip -q "$PINKY_ZIP" \
            -d "$GITHUB_WORKSPACE/pinky_project"

          echo ""
          echo "Extracted project structure:"
          find "$GITHUB_WORKSPACE/pinky_project" \
            -maxdepth 4 \
            -type f \
            \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
            \
            -print | sort


      # =========================================================
      # 4) Detect Android project root
      # =========================================================
      - name: Detect Android project root
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT=""

          SETTINGS_FILE="$(
            find "$GITHUB_WORKSPACE/pinky_project" \
              -type f \
              \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \
              -not -path "*/build/*" \
              -print \
              -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts was not found after extracting ZIP."
            echo ""
            echo "Extracted files:"
            find "$GITHUB_WORKSPACE/pinky_project" \
              -maxdepth 5 \
              -type f \
              -print | sort | head -500
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          echo "Android project detected:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"


      # =========================================================
      # 5) Show project
      # =========================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Pinky Android Project"
          echo "========================================"

          echo "PROJECT_ROOT:"
          echo "$PROJECT_ROOT"

          echo ""
          echo "Project files:"
          ls -la "$PROJECT_ROOT"

          echo ""
          echo "Gradle files:"
          find "$PROJECT_ROOT/gradle" \
            -maxdepth 3 \
            -type f \
            -print 2>/dev/null || true


      # =========================================================
      # 6) Setup Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # =========================================================
      # 7) Setup Gradle
      # =========================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"


      # =========================================================
      # 8) Prepare environment
      # =========================================================
      - name: Prepare environment
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "ERROR: SUPABASE_URL GitHub Secret is missing."
            echo "Go to:"
            echo "Settings -> Secrets and variables -> Actions"
            exit 1
          fi

          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "ERROR: SUPABASE_ANON_KEY GitHub Secret is missing."
            echo "Go to:"
            echo "Settings -> Secrets and variables -> Actions"
            exit 1
          fi

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            GEMINI_VALUE="DISABLED"
          else
            GEMINI_VALUE="${GEMINI_API_KEY}"
          fi

          if [ -z "${OWNER_PASSWORD:-}" ]; then
            OWNER_VALUE="DISABLED"
          else
            OWNER_VALUE="${OWNER_PASSWORD}"
          fi

          cat > .env <<EOF
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          GEMINI_API_KEY=${GEMINI_VALUE}
          OWNER_PASSWORD=${OWNER_VALUE}
          EOF

          echo "Environment prepared successfully."

          if [ "$GEMINI_VALUE" = "DISABLED" ]; then
            echo "Gemini API: DISABLED"
          else
            echo "Gemini API: CONFIGURED"
          fi

          if [ "$OWNER_VALUE" = "DISABLED" ]; then
            echo "Owner password: DISABLED"
          else
            echo "Owner password: CONFIGURED"
          fi


      # =========================================================
      # 9) Prepare debug keystore
      # =========================================================
      - name: Prepare debug keystore
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then

            keytool \
              -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          fi

          echo "Debug keystore ready."


      # =========================================================
      # 10) Check Gradle
      # =========================================================
      - name: Check Gradle
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          gradle --version


      # =========================================================
      # 11) Clean project
      # =========================================================
      - name: Clean project
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          gradle clean \
            --no-daemon \
            --stacktrace


      # =========================================================
      # 12) Build APK
      # =========================================================
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
