name: Build Elory Dashboard APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '.github/workflows/build-elory-dashboard.yml'

permissions:
  contents: read

concurrency:
  group: elory-dashboard-apk
  cancel-in-progress: false

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Install only platform-tools here. Android Gradle Plugin downloads
      # the exact compile SDK/build-tools required by compileSdk 36.1.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Detect project location
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f 'dash/settings.gradle.kts' && -f 'dash/app/build.gradle.kts' ]]; then
            PROJECT_DIR='dash'
          elif [[ -f 'settings.gradle.kts' && -f 'app/build.gradle.kts' ]]; then
            PROJECT_DIR='.'
          else
            echo 'Could not find the Android project in the repository root or ./dash.'
            echo 'Expected settings.gradle.kts and app/build.gradle.kts.'
            echo 'Repository files:'
            ls -la
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project directory: $PROJECT_DIR"

      - name: Validate and prepare project
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f .env.example

          cp .env.example .env
          python3 - <<'PYENV'
          import os
          from pathlib import Path

          env_file = Path('.env')
          lines = env_file.read_text().splitlines()
          api_key = os.environ.get('GEMINI_API_KEY', '')
          lines = [line for line in lines if not line.startswith('GEMINI_API_KEY=')]
          lines.append('GEMINI_API_KEY=' + api_key)
          env_file.write_text('\n'.join(lines) + '\n')
          PYENV

          if [[ ! -f debug.keystore ]]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi

      - name: Apply previously identified Kotlin compile fix
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"
          python3 - <<'PYFIX'
          from pathlib import Path

          file = Path('app/src/main/java/com/pinky/dashboard/ui/screens/health/HealthCheckScreen.kt')
          if not file.is_file():
              raise SystemExit(f'Expected source file not found: {file}')

          source = file.read_text()
          old = 'SupabaseClient.service.getProducts()'
          new = '''SupabaseClient.service.getProducts(
                      select = "*",
                      order = "id.asc",
                      range = "0-999",
                      rangeUnit = "items"
                  )'''

          if old in source:
              file.write_text(source.replace(old, new, 1))
              print('Applied the known getProducts() compile fix.')
          elif 'rangeUnit = "items"' in source:
              print('The getProducts() call already appears to be fixed.')
          else:
              raise SystemExit('Could not identify the expected getProducts() call; stopping safely.')
          PYFIX

      - name: Build Debug APK
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle --no-daemon --stacktrace --max-workers=2 \
            -p "$PROJECT_DIR" :app:assembleDebug

      - name: Verify and stage APK
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "$RUNNER_TEMP/app-debug.apk"
          ls -lh "$RUNNER_TEMP/app-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elory-Dashboard-APK
          path: ${{ runner.temp }}/app-debug.apk
          if-no-files-found: error
          retention-days: 30
