name: Build Elory Dashboard APK

on:
  workflow_dispatch:
  push:
    paths:
      - "dash/**"
      - ".github/workflows/build-elory-dashboard.yml"

permissions:
  contents: read

concurrency:
  group: elory-dashboard-apk
  cancel-in-progress: false

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # v4 avoids requesting Google's retired "tools" SDK package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages required by this project
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Validate and prepare project
        working-directory: dash
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -Eeuo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f .env.example

          cp .env.example .env
          python3 - <<'PYENV'
          import os
          from pathlib import Path

          env_file = Path(".env")
          lines = env_file.read_text().splitlines()
          api_key = os.environ.get("GEMINI_API_KEY", "")
          lines = [line for line in lines if not line.startswith("GEMINI_API_KEY=")]
          lines.append("GEMINI_API_KEY=" + api_key)
          env_file.write_text("\n".join(lines) + "\n")
          PYENV

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Apply compatibility fix for the previously reported Kotlin call
        working-directory: dash
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PYFIX'
          from pathlib import Path

          file = Path("app/src/main/java/com/pinky/dashboard/ui/screens/health/HealthCheckScreen.kt")
          source = file.read_text()
          old = "SupabaseClient.service.getProducts()"
          new = """SupabaseClient.service.getProducts(
                      select = "*",
                      order = "id.asc",
                      range = "0-999",
                      rangeUnit = "items"
                  )"""

          if old in source:
              file.write_text(source.replace(old, new, 1))
              print("Applied the known getProducts() compile fix.")
          elif 'rangeUnit = "items"' in source:
              print("The catalog call is already fixed.")
          else:
              raise SystemExit("Could not identify the catalog call; stopping rather than changing unrelated code.")
          PYFIX

      - name: Build Debug APK
        working-directory: dash
        run: gradle --no-daemon --stacktrace --max-workers=2 :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="dash/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elory-Dashboard-APK
          path: dash/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
