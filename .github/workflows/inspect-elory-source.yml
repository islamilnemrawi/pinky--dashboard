name: Inspect Elory Dashboard source layout

on:
  push:
    branches:
      - feature/elory-owner-reset-site-editor-2026-11-17
    paths:
      - '.github/workflows/inspect-elory-source.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive and report UI integration points
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/elory-source"
          unzip -q Elory_Dashboard_Build_Ready.zip -d "$RUNNER_TEMP/elory-source"
          PROJECT_DIR="$(dirname "$(find "$RUNNER_TEMP/elory-source" -type f -name settings.gradle.kts -print -quit)")"
          export PROJECT_DIR
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          root = Path(os.environ["PROJECT_DIR"])
          src = root / "app/src/main/java"
          terms = ("order", "customer", "coupon", "website", "pinkapp")
          print("=== SCREEN FILE CANDIDATES ===")
          for p in sorted(src.rglob("*.kt")):
              if any(t in p.name.lower() or t in str(p.parent).lower() for t in terms):
                  print(p.relative_to(src))
          print("=== SCREEN COMPOSABLE SIGNATURES ===")
          for p in sorted(src.rglob("*.kt")):
              if any(t in p.name.lower() for t in ("order", "customer", "coupon", "website")):
                  lines = p.read_text(encoding="utf-8").splitlines()
                  hits = [i for i, line in enumerate(lines) if "@Composable" in line or re.search(r"^\\s*(?:private\\s+)?fun\\s+\\w+.*Screen", line)]
                  if hits:
                      print(f"--- {p.relative_to(src)} ({len(lines)} lines) ---")
                      for i in hits[:25]:
                          lo=max(0,i-1); hi=min(len(lines),i+5)
                          for n in range(lo,hi): print(f"{n+1}: {lines[n]}")
          print("=== PINKY APP SCREEN ROUTING ===")
          app = next(src.rglob("PinkyApp.kt"), None)
          if app:
              lines=app.read_text(encoding="utf-8").splitlines()
              for i,line in enumerate(lines):
                  if re.search(r"(Orders|Customers|Coupon|WebsiteEditor|Reports)Screen|selectedTab|currentScreen|Screen\(", line, re.I):
                      print(f"{i+1}: {line[:300]}")
          print("=== WEBSITE EDITOR COMPOSABLES ===")
          for p in src.rglob("WebsiteEditorScreen.kt"):
              lines=p.read_text(encoding="utf-8").splitlines()
              for i,line in enumerate(lines):
                  if re.search(r"^\\s*(?:private\\s+)?fun\\s+\\w+", line):
                      print(f"{i+1}: {line[:300]}")
          PY